<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flower Garden</title>
<style>
    * { margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  iframe {
    width: 100vw;
    height: 100vh;
    border: none;
    display: block;
  }
  .next-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 9999;
    background: transparent;
    color: rgba(255,255,255,0.8);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    font-family: 'Segoe UI', sans-serif;
  }
  .next-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.6);
    color: #fff;
  }
</style>
</head>
<body>
  <iframe src="https://adakaominak-code.github.io/flower-garden-.0/"></iframe>
  <button class="next-btn" onclick="window.location.href='https://uugi.my.canva.site/2'">NEXT</button>
</body>
</html>
